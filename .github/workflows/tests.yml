name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[scanner,dev]'
      - run: python -m pytest -q
      - run: PEGASUSHUNTER_TEST_MVT_INTEGRATION=1 python -m pytest -q tests/test_cli.py::test_real_mvt_androidqf_zip_smoke
      - run: ruff check pegasushunter tests
      - run: pyright
      - run: python -m compileall -q pegasushunter
      - run: python -m pegasushunter --help
      - run: python -m build
      - name: Install and smoke-test built wheel
        run: |
          python -m venv "$RUNNER_TEMP/pegasushunter-wheel"
          "$RUNNER_TEMP/pegasushunter-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/pegasushunter-wheel/bin/pegasushunter" --help
          "$RUNNER_TEMP/pegasushunter-wheel/bin/pegasushunter" summarize tests/fixtures/androidqf --format json
