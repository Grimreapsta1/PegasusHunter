[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus-hunter"
version = "0.1.0"
description = "Plain-English summaries and privacy-conscious MVT mobile spyware triage"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Pegasus Hunter contributors"}]
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
dependencies = []

[project.optional-dependencies]
scanner = ["mvt==2026.11.2"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9", "pyright>=1.1"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["pegasushunter", "tests"]

[project.scripts]
pegasushunter = "pegasushunter.cli:main"

[tool.setuptools.packages.find]
include = ["pegasushunter*"]
